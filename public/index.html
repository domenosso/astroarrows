<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AstroArrows Online</title>
    <script src="https://js.pusher.com/8.0/pusher.min.js"></script>
    <style>
        :root { --red: #ff4757; --green: #2ed573; --yellow: #ffa502; --dark: #2f3542; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #2f3542; font-family: 'Arial Black', sans-serif; user-select: none; touch-action: none; }
        
        #orientation-warning {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #2f3542; color: white;
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        #orientation-warning .icon {
            font-size: 50px;
            margin-bottom: 15px;
            animation: rotate-anim 2s infinite ease-in-out;
        }
        @keyframes rotate-anim {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-90deg); }
        }

        @media screen and (orientation: portrait) and (max-width: 900px) {
            #orientation-warning { display: flex; }
        }

        #menu { position: absolute; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: white; z-index: 1000; flex-direction: column; }
        .card { background: #f1f2f6; padding: 20px 30px; border-radius: 25px; border: 5px solid var(--dark); display: flex; flex-direction: column; gap: 10px; width: 320px; box-shadow: 0 10px 20px rgba(0,0,0,0.15); box-sizing: border-box; }
        input { padding: 10px; border: 3px solid #dfe4ea; border-radius: 12px; font-size: 15px; text-align: center; outline: none; }
        .btn { padding: 12px; border: none; border-radius: 12px; background: var(--dark); color: white; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.1s; }
        .btn:active { transform: scale(0.98); }
        .btn-sec { background: #747d8c; padding: 8px; font-size: 13px; }
        .team-btn { flex: 1; padding: 10px; border: 3px solid var(--dark); border-radius: 10px; opacity: 0.4; color: white; font-weight: bold; cursor: pointer; }
        .team-btn.active { opacity: 1; transform: scale(1.05); }

        #ui { position: absolute; top: 0; width: 100%; height: 100%; pointer-events: none; display: none; }
        .top-bar { position: absolute; top: 12px; width: 100%; display: flex; justify-content: center; gap: 30px; }
        .room-tag { position: absolute; top: 12px; left: 15px; background: white; border: 3px solid var(--dark); border-radius: 8px; padding: 4px 10px; font-size: 12px; color: var(--dark); font-weight: bold; }
        .base-hp { width: 140px; background: white; border: 3px solid var(--dark); border-radius: 8px; height: 18px; position: relative; overflow: hidden; }
        .base-hp-fill { height: 100%; transition: 0.2s; }
        .base-hp-text { position: absolute; width: 100%; text-align: center; font-size: 11px; line-height: 18px; color: var(--dark); font-weight: bold; }

        #minimap { position: absolute; top: 12px; right: 15px; width: 120px; height: 80px; background: rgba(255,255,255,0.85); border: 3px solid var(--dark); border-radius: 12px; }
        .joy-zone { position: absolute; bottom: 25px; width: 110px; height: 110px; background: rgba(255,255,255,0.25); border-radius: 50%; pointer-events: auto; display: flex; align-items: center; justify-content: center; }
        .stick { width: 45px; height: 45px; background: white; border-radius: 50%; border: 3px solid var(--dark); box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        canvas { display: block; background: white; }
    </style>
</head>
<body>

<div id="orientation-warning">
    <div class="icon">📱</div>
    <h2>ПОВЕРНИТЕ УСТРОЙСТВО</h2>
    <p>Для комфортной игры переведите телефон в горизонтальный режим</p>
</div>

<div id="menu">
    <h1 style="color:var(--dark); margin:0 0 10px 0; font-size:20px; text-align:center;">ASTRO ARROWS</h1>
    <div class="card">
        <input type="text" id="nick" placeholder="ТВОЙ НИК" maxlength="10">
        
        <div style="display:flex; gap:8px;">
            <input type="text" id="room-code" placeholder="КОД (4 ЦИФРЫ)" maxlength="4" style="flex:1;">
            <button class="btn btn-sec" onclick="genCode()">СОЗДАТЬ</button>
        </div>

        <div style="display:flex; gap:10px; margin-top:5px;">
            <button class="team-btn active" id="btn-g" style="background:var(--green)" onclick="setTeam('green')">ЗЕЛЕНЫЕ</button>
            <button class="team-btn" id="btn-r" style="background:var(--red)" onclick="setTeam('red')">КРАСНЫЕ</button>
        </div>
        <button class="btn" style="margin-top:5px;" onclick="startGame()">ИГРАТЬ</button>
    </div>
</div>

<div id="ui">
    <div class="room-tag" id="ui-room-code">ROOM: ----</div>
    <div class="top-bar">
        <div>
            <div style="font-size:10px; text-align:center; color:var(--dark);">GREEN BASE</div>
            <div class="base-hp"><div id="hp-g-bar" class="base-hp-fill" style="background:var(--green)"></div><div id="hp-g-txt" class="base-hp-text">100/100</div></div>
        </div>
        <div>
            <div style="font-size:10px; text-align:center; color:var(--dark);">RED BASE</div>
            <div class="base-hp"><div id="hp-r-bar" class="base-hp-fill" style="background:var(--red)"></div><div id="hp-r-txt" class="base-hp-text">100/100</div></div>
        </div>
    </div>
    <canvas id="minimap"></canvas>
    <div id="joy-l" class="joy-zone" style="left:35px;"><div class="stick"></div></div>
    <div id="joy-r" class="joy-zone" style="right:35px;"><div class="stick"></div></div>
</div>

<canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const mmap = document.getElementById('minimap');
    const mctx = mmap.getContext('2d');
    
    let WORLD = { w: 3000, h: 2000 };
    let myNick = "", myTeam = "green", roomCode = "", myId = "p_" + Math.random().toString(36).substr(2, 7);
    let inputs = { move: {x:0, y:0}, shoot: {x:0, y:0} };
    
    let gameState = {
        players: {},
        bullets: [],
        bases: { 
            green: { x: 300, y: 300, hp: 100 },
            red: { x: 2700, y: 1700, hp: 100 }
        }
    };

    let channel = null;

    function genCode() {
        const code = Math.floor(1000 + Math.random() * 9000).toString();
        document.getElementById('room-code').value = code;
    }

    function setTeam(t) {
        myTeam = t;
        document.getElementById('btn-g').classList.toggle('active', t === 'green');
        document.getElementById('btn-r').classList.toggle('active', t === 'red');
    }

    async function startGame() {
        myNick = document.getElementById('nick').value.trim() || "Player";
        roomCode = document.getElementById('room-code').value.trim();

        if(!/^\d{4}$/.test(roomCode)) {
            alert("Введите или сгенерируйте 4-значный код комнаты!");
            return;
        }

        const pusher = new Pusher('932af3e401d9bf010eb9', {
            cluster: 'us2',
            authEndpoint: '/api/pusher-auth'
        });

        // Создаем отдельный канал под 4-значный код
        channel = pusher.subscribe(`private-room-${roomCode}`);

        channel.bind('pusher:subscription_succeeded', () => {
            let teamCount = Object.values(gameState.players).filter(p => p.t === myTeam).length;
            if(teamCount >= 3) {
                alert(`В команде ${myTeam.toUpperCase()} этой комнаты уже 3 игрока!`);
                location.reload();
                return;
            }

            const start = myTeam === 'green' ? gameState.bases.green : gameState.bases.red;
            gameState.players[myId] = {
                x: start.x + (Math.random() * 80 - 40),
                y: start.y + (Math.random() * 80 - 40),
                vx: 0, vy: 0,
                t: myTeam,
                n: myNick,
                hp: 3,
                a: 0,
                s: 0
            };

            document.getElementById('ui-room-code').innerText = "ROOM: " + roomCode;
            document.getElementById('menu').style.display = 'none';
            document.getElementById('ui').style.display = 'block';

            resize();
            requestAnimationFrame(gameLoop);

            setInterval(() => {
                if(gameState.players[myId] && channel) {
                    channel.trigger('client-player-update', {
                        id: myId,
                        player: gameState.players[myId]
                    });
                }
            }, 50);
        });

        channel.bind('client-player-update', (data) => {
            gameState.players[data.id] = data.player;
        });

        channel.bind('client-shoot', (b) => {
            gameState.bullets.push(b);
        });

        channel.bind('client-base-damage', (data) => {
            if(gameState.bases[data.team]) {
                gameState.bases[data.team].hp = Math.max(0, gameState.bases[data.team].hp - data.damage);
            }
        });
    }

    function gameLoop() {
        let me = gameState.players[myId];

        if (me) {
            me.vx += inputs.move.x * 0.8;
            me.vy += inputs.move.y * 0.8;
            me.x += me.vx;
            me.y += me.vy;
            me.vx *= 0.92;
            me.vy *= 0.92;
            me.x = Math.max(50, Math.min(WORLD.w - 50, me.x));
            me.y = Math.max(50, Math.min(WORLD.h - 50, me.y));

            if (Math.hypot(inputs.shoot.x, inputs.shoot.y) > 0.2) {
                me.a = Math.atan2(inputs.shoot.y, inputs.shoot.x);
                if (Date.now() - me.s > 300) {
                    let bullet = { 
                        x: me.x, 
                        y: me.y, 
                        vx: Math.cos(me.a) * 20, 
                        vy: Math.sin(me.a) * 20, 
                        t: me.t,
                        owner: myId
                    };
                    gameState.bullets.push(bullet);
                    if(channel) channel.trigger('client-shoot', bullet);
                    me.s = Date.now();
                }
            }
        }

        for (let bi = gameState.bullets.length - 1; bi >= 0; bi--) {
            let b = gameState.bullets[bi];
            b.x += b.vx;
            b.y += b.vy;

            if (b.x < 0 || b.x > WORLD.w || b.y < 0 || b.y > WORLD.h) {
                gameState.bullets.splice(bi, 1);
                continue;
            }

            if (b.owner === myId) {
                for (let team in gameState.bases) {
                    let base = gameState.bases[team];
                    if (b.t !== team && Math.hypot(b.x - base.x, b.y - base.y) < 100) {
                        // 1 ПУЛЯ СНОСИТ 3 ХП БАШНИ
                        base.hp = Math.max(0, base.hp - 3);
                        gameState.bullets.splice(bi, 1);
                        if(channel) {
                            channel.trigger('client-base-damage', { team: team, damage: 3 });
                        }
                        break;
                    }
                }
            }

            for (let id in gameState.players) {
                let p = gameState.players[id];
                if (b.t !== p.t && Math.hypot(b.x - p.x, b.y - p.y) < 35) {
                    if (id === myId) {
                        p.hp--;
                        if (p.hp <= 0) {
                            let start = p.t === 'green' ? gameState.bases.green : gameState.bases.red;
                            p.x = start.x;
                            p.y = start.y;
                            p.hp = 3;
                        }
                    }
                    gameState.bullets.splice(bi, 1);
                    break;
                }
            }
        }

        draw();
        requestAnimationFrame(gameLoop);
    }

    function draw() {
        const me = gameState.players[myId] || {x: WORLD.w/2, y: WORLD.h/2};
        
        ctx.setTransform(1,0,0,1,0,0);
        ctx.fillStyle = "white"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.translate(canvas.width/2, canvas.height/2);
        ctx.scale(0.7, 0.7);
        ctx.translate(-me.x, -me.y);

        ctx.strokeStyle = "#eee"; ctx.lineWidth = 4;
        for(let x=0; x<=WORLD.w; x+=200) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,WORLD.h); ctx.stroke(); }
        for(let y=0; y<=WORLD.h; y+=200) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(WORLD.w,y); ctx.stroke(); }

        for(let t in gameState.bases) {
            let b = gameState.bases[t];
            let g = ctx.createRadialGradient(b.x, b.y, 10, b.x, b.y, 100);
            g.addColorStop(0, '#ff00ff'); g.addColorStop(1, '#7000ff');
            ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x, b.y, 100, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = "black"; ctx.lineWidth = 8; ctx.stroke();
            ctx.fillStyle = "black"; ctx.font = "bold 30px Arial"; ctx.textAlign = "center";
            ctx.fillText(b.hp + "/100", b.x, b.y - 120);
        }

        for(let id in gameState.players) {
            let p = gameState.players[id];
            ctx.save(); ctx.translate(p.x, p.y);
            ctx.fillStyle = p.t === 'green' ? '#2ed573' : '#ff4757';
            ctx.strokeStyle = 'black'; ctx.lineWidth = 6;
            ctx.beginPath(); ctx.arc(0, 0, 40, 0, Math.PI*2); ctx.fill(); ctx.stroke();
            ctx.rotate(p.a); ctx.fillStyle = "black";
            ctx.beginPath(); ctx.roundRect(25, -12, 30, 24, 5); ctx.fill();
            ctx.restore();
            
            ctx.fillStyle = "black"; ctx.font = "bold 25px Arial"; ctx.textAlign = "center";
            ctx.fillText(p.n, p.x, p.y - 80);
            ctx.fillText(p.hp + "/3 HP", p.x, p.y - 55);
        }

        gameState.bullets.forEach(b => {
            ctx.fillStyle = "yellow"; ctx.strokeStyle = "black"; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.arc(b.x, b.y, 12, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        });

        ctx.setTransform(1,0,0,1,0,0);
        updateUI();
    }

    function updateUI() {
        document.getElementById('hp-g-bar').style.width = gameState.bases.green.hp + "%";
        document.getElementById('hp-r-bar').style.width = gameState.bases.red.hp + "%";
        document.getElementById('hp-g-txt').innerText = gameState.bases.green.hp + "/100";
        document.getElementById('hp-r-txt').innerText = gameState.bases.red.hp + "/100";

        mctx.clearRect(0,0,120,80);
        const kx = 120/WORLD.w, ky = 80/WORLD.h;
        mctx.fillStyle = "purple";
        mctx.fillRect(gameState.bases.green.x*kx-4, gameState.bases.green.y*ky-4, 8, 8);
        mctx.fillRect(gameState.bases.red.x*kx-4, gameState.bases.red.y*ky-4, 8, 8);
        for(let id in gameState.players) {
            let p = gameState.players[id];
            mctx.fillStyle = p.t === 'green' ? 'green' : 'red';
            mctx.beginPath(); mctx.arc(p.x*kx, p.y*ky, 4, 0, Math.PI*2); mctx.fill();
            if(id === myId) mctx.strokeRect(p.x*kx-5, p.y*ky-5, 10, 10);
        }
        
        if(gameState.bases.green.hp <= 0) { alert("RED WINS!"); location.reload(); }
        if(gameState.bases.red.hp <= 0) { alert("GREEN WINS!"); location.reload(); }
    }

    function resize() { 
        canvas.width = window.innerWidth; 
        canvas.height = window.innerHeight; 
        mmap.width = 120; 
        mmap.height = 80; 
    }
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', resize);

    function initJoy(id, axis) {
        const zone = document.getElementById(id), stick = zone.querySelector('.stick');
        let active = false, tid = null;
        const move = (ex, ey) => {
            const r = zone.getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2;
            let dx = ex - cx, dy = ey - cy, d = Math.hypot(dx, dy);
            if(d > 45) { dx *= 45/d; dy *= 45/d; }
            stick.style.transform = `translate(${dx}px, ${dy}px)`;
            inputs[axis] = { x: dx/45, y: dy/45 };
        };
        zone.addEventListener('touchstart', e => { active = true; tid = e.changedTouches[0].identifier; move(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); }, {passive:false});
        window.addEventListener('touchmove', e => { if(active) Array.from(e.touches).forEach(t => { if(t.identifier === tid) move(t.clientX, t.clientY); }); }, {passive:false});
        window.addEventListener('touchend', () => { active = false; stick.style.transform = ''; inputs[axis] = {x:0,y:0}; });
        zone.addEventListener('mousedown', e => { active = true; move(e.clientX, e.clientY); });
        window.addEventListener('mousemove', e => { if(active) move(e.clientX, e.clientY); });
        window.addEventListener('mouseup', () => { active = false; stick.style.transform = ''; inputs[axis] = {x:0,y:0}; });
    }
    initJoy('joy-l', 'move'); initJoy('joy-r', 'shoot');
</script>
</body>
</html>
