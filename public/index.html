<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AstroArrows Online</title>
    <script src="https://js.pusher.com/8.0/pusher.min.js"></script>
    <style>
        :root { 
            --red: #ff4757; 
            --green: #2ed573; 
            --yellow: #ffa502; 
            --dark: #2f3542; 
            --accent: #70a1ff;
        }
        
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1e272e; font-family: 'Arial Black', sans-serif; user-select: none; touch-action: none; }
        
        /* Предупреждение об ориентации */
        #orientation-warning {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #1e272e; color: white;
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        #orientation-warning .icon {
            font-size: 50px;
            margin-bottom: 15px;
            animation: rotate-anim 2s infinite ease-in-out;
        }
        @keyframes rotate-anim {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-90deg); }
        }

        @media screen and (orientation: portrait) and (max-width: 900px) {
            #orientation-warning { display: flex; }
        }

        /* --- АНИМИРОВАННОЕ МЕНЮ --- */
        #menu { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            z-index: 1000; 
            flex-direction: column;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            overflow: hidden;
        }

        /* Задний анимированный фон меню */
        #menu-bg-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .title-container {
            z-index: 1;
            text-align: center;
            margin-bottom: 15px;
        }

        .game-title {
            color: #fff;
            font-size: 32px;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(112, 161, 255, 0.8), 0 0 20px rgba(112, 161, 255, 0.4);
            margin: 0;
            animation: glow 3s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px #70a1ff, 0 0 20px #70a1ff; }
            to { text-shadow: 0 0 20px #2ed573, 0 0 30px #2ed573; }
        }

        .card { 
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.92); 
            backdrop-filter: blur(10px);
            padding: 25px 30px; 
            border-radius: 25px; 
            border: 4px solid var(--dark); 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            width: 340px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.5); 
            animation: card-appear 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes card-appear {
            from { transform: scale(0.8) translateY(30px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        input { 
            padding: 12px; 
            border: 3px solid #dfe4ea; 
            border-radius: 12px; 
            font-size: 15px; 
            text-align: center; 
            outline: none; 
            font-family: inherit;
            transition: border-color 0.2s;
        }
        input:focus { border-color: var(--accent); }

        .btn { 
            padding: 12px; 
            border: none; 
            border-radius: 12px; 
            background: var(--dark); 
            color: white; 
            font-size: 15px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: all 0.2s ease; 
            box-shadow: 0 4px 0 #1e272e;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 #1e272e; }
        .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #1e272e; }
        
        .btn-sec { 
            background: #57606f; 
            box-shadow: 0 4px 0 #2f3542;
            padding: 10px; 
            font-size: 13px; 
        }

        .team-btn { 
            flex: 1; 
            padding: 12px; 
            border: 3px solid var(--dark); 
            border-radius: 12px; 
            opacity: 0.5; 
            color: white; 
            font-weight: bold; 
            cursor: pointer; 
            transition: all 0.2s ease;
        }
        .team-btn.active { 
            opacity: 1; 
            transform: scale(1.05); 
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* --- ИГРОВОЙ ИНТЕРФЕЙС --- */
        #ui { position: absolute; top: 0; width: 100%; height: 100%; pointer-events: none; display: none; z-index: 10; }
        .top-bar { position: absolute; top: 12px; width: 100%; display: flex; justify-content: center; gap: 30px; }
        .room-tag { 
            position: absolute; top: 12px; left: 15px; 
            background: white; border: 3px solid var(--dark); 
            border-radius: 10px; padding: 6px 12px; 
            font-size: 13px; color: var(--dark); font-weight: bold; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .base-hp { 
            width: 150px; background: white; 
            border: 3px solid var(--dark); border-radius: 10px; 
            height: 20px; position: relative; overflow: hidden; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .base-hp-fill { height: 100%; transition: width 0.2s ease-out; }
        .base-hp-text { position: absolute; width: 100%; text-align: center; font-size: 11px; line-height: 20px; color: var(--dark); font-weight: bold; }

        #minimap { 
            position: absolute; top: 12px; right: 15px; 
            width: 140px; height: 90px; 
            background: rgba(255,255,255,0.85); 
            border: 3px solid var(--dark); border-radius: 12px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .joy-zone { 
            position: absolute; bottom: 30px; 
            width: 120px; height: 120px; 
            background: rgba(255,255,255,0.2); 
            border: 2px dashed rgba(255,255,255,0.5);
            border-radius: 50%; pointer-events: auto; 
            display: flex; align-items: center; justify-content: center; 
        }
        .stick { 
            width: 50px; height: 50px; 
            background: white; border-radius: 50%; 
            border: 4px solid var(--dark); 
            box-shadow: 0 6px 10px rgba(0,0,0,0.3); 
        }

        /* Сообщение о респауне */
        #respawn-screen {
            display: none;
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            color: white; font-size: 28px;
            flex-direction: column; justify-content: center; align-items: center;
            z-index: 20;
            text-align: center;
        }

        canvas { display: block; background: #2f3542; }
    </style>
</head>
<body>

<div id="orientation-warning">
    <div class="icon">📱</div>
    <h2>ПОВЕРНИТЕ УСТРОЙСТВО</h2>
    <p>Для комфортной игры переведите телефон в горизонтальный режим</p>
</div>

<!-- МЕНЮ С АНИМИРОВАННЫМ ФОНОМ -->
<div id="menu">
    <canvas id="menu-bg-canvas"></canvas>
    
    <div class="title-container">
        <h1 class="game-title">ASTRO ARROWS</h1>
    </div>

    <div class="card">
        <input type="text" id="nick" placeholder="ТВОЙ НИК" maxlength="10">
        
        <div style="display:flex; gap:8px;">
            <input type="text" id="room-code" placeholder="КОД (4 ЦИФРЫ)" maxlength="4" style="flex:1;">
            <button class="btn btn-sec" onclick="genCode()">СОЗДАТЬ</button>
        </div>

        <div style="display:flex; gap:10px; margin-top:5px;">
            <button class="team-btn active" id="btn-g" style="background:var(--green)" onclick="setTeam('green')">ЗЕЛЕНЫЕ</button>
            <button class="team-btn" id="btn-r" style="background:var(--red)" onclick="setTeam('red')">КРАСНЫЕ</button>
        </div>
        <button class="btn" style="margin-top:8px;" onclick="startGame()">ИГРАТЬ</button>
    </div>
</div>

<!-- ЭКРАН РЕСПАУНА -->
<div id="respawn-screen">
    <div style="color: var(--red); font-size: 40px; margin-bottom: 10px;">ТЫ ВЫБЫЛ!</div>
    <div>Возрождение через: <span id="respawn-timer">3</span> сек</div>
</div>

<!-- HUD ИНТЕРФЕЙС -->
<div id="ui">
    <div class="room-tag" id="ui-room-code">ROOM: ----</div>
    <div class="top-bar">
        <div>
            <div style="font-size:10px; text-align:center; color:white; margin-bottom:2px;">GREEN BASE</div>
            <div class="base-hp"><div id="hp-g-bar" class="base-hp-fill" style="background:var(--green)"></div><div id="hp-g-txt" class="base-hp-text">100/100</div></div>
        </div>
        <div>
            <div style="font-size:10px; text-align:center; color:white; margin-bottom:2px;">RED BASE</div>
            <div class="base-hp"><div id="hp-r-bar" class="base-hp-fill" style="background:var(--red)"></div><div id="hp-r-txt" class="base-hp-text">100/100</div></div>
        </div>
    </div>
    <canvas id="minimap"></canvas>
    <div id="joy-l" class="joy-zone" style="left:40px;"><div class="stick"></div></div>
    <div id="joy-r" class="joy-zone" style="right:40px;"><div class="stick"></div></div>
</div>

<canvas id="canvas"></canvas>

<script>
    // --- АНИМАЦИЯ ФОНА МЕНЮ ---
    const bgCanvas = document.getElementById('menu-bg-canvas');
    const bgCtx = bgCanvas.getContext('2d');
    let bgParticles = [];

    function initMenuBg() {
        bgCanvas.width = window.innerWidth;
        bgCanvas.height = window.innerHeight;
        bgParticles = [];
        for(let i = 0; i < 40; i++) {
            bgParticles.push({
                x: Math.random() * bgCanvas.width,
                y: Math.random() * bgCanvas.height,
                size: Math.random() * 4 + 2,
                speedX: (Math.random() - 0.5) * 1.5,
                speedY: (Math.random() - 0.5) * 1.5,
                color: Math.random() > 0.5 ? '#70a1ff' : '#2ed573'
            });
        }
    }

    function renderMenuBg() {
        if(document.getElementById('menu').style.display === 'none') return;
        bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
        bgParticles.forEach(p => {
            p.x += p.speedX; p.y += p.speedY;
            if(p.x < 0) p.x = bgCanvas.width; if(p.x > bgCanvas.width) p.x = 0;
            if(p.y < 0) p.y = bgCanvas.height; if(p.y > bgCanvas.height) p.y = 0;
            
            bgCtx.fillStyle = p.color;
            bgCtx.beginPath();
            bgCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            bgCtx.fill();
        });
        requestAnimationFrame(renderMenuBg);
    }

    initMenuBg();
    renderMenuBg();

    // --- ДВИЖОК ИГРЫ ---
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const mmap = document.getElementById('minimap');
    const mctx = mmap.getContext('2d');
    
    // КАРТА УВЕЛИЧЕНА В 2 РАЗА (6000x4000)
    let WORLD = { w: 6000, h: 4000 };
    let myNick = "", myTeam = "green", roomCode = "", myId = "p_" + Math.random().toString(36).substr(2, 7);
    let inputs = { move: {x:0, y:0}, shoot: {x:0, y:0} };
    let isDead = false;
    let particles = [];
    
    let gameState = {
        players: {},
        bullets: [],
        bases: { 
            green: { x: 500, y: 500, hp: 100 },
            red: { x: 5500, y: 3500, hp: 100 }
        }
    };

    let channel = null;

    function genCode() {
        const code = Math.floor(1000 + Math.random() * 9000).toString();
        document.getElementById('room-code').value = code;
    }

    function setTeam(t) {
        myTeam = t;
        document.getElementById('btn-g').classList.toggle('active', t === 'green');
        document.getElementById('btn-r').classList.toggle('active', t === 'red');
    }

    async function startGame() {
        myNick = document.getElementById('nick').value.trim() || "Player";
        roomCode = document.getElementById('room-code').value.trim();

        if(!/^\d{4}$/.test(roomCode)) {
            alert("Введите или сгенерируйте 4-значный код комнаты!");
            return;
        }

        const pusher = new Pusher('932af3e401d9bf010eb9', {
            cluster: 'us2',
            authEndpoint: '/api/pusher-auth'
        });

        channel = pusher.subscribe(`private-room-${roomCode}`);

        channel.bind('pusher:subscription_succeeded', () => {
            let teamCount = Object.values(gameState.players).filter(p => p.t === myTeam).length;
            if(teamCount >= 3) {
                alert(`В команде ${myTeam.toUpperCase()} этой комнаты уже 3 игрока!`);
                location.reload();
                return;
            }

            const start = myTeam === 'green' ? gameState.bases.green : gameState.bases.red;
            gameState.players[myId] = {
                x: start.x + (Math.random() * 100 - 50),
                y: start.y + (Math.random() * 100 - 50),
                vx: 0, vy: 0,
                t: myTeam,
                n: myNick,
                hp: 3,
                a: 0,
                s: 0
            };

            document.getElementById('ui-room-code').innerText = "ROOM: " + roomCode;
            document.getElementById('menu').style.display = 'none';
            document.getElementById('ui').style.display = 'block';

            resize();
            requestAnimationFrame(gameLoop);

            setInterval(() => {
                if(gameState.players[myId] && channel) {
                    channel.trigger('client-player-update', {
                        id: myId,
                        player: gameState.players[myId]
                    });
                }
            }, 50);
        });

        channel.bind('client-player-update', (data) => {
            gameState.players[data.id] = data.player;
        });

        channel.bind('client-shoot', (b) => {
            gameState.bullets.push(b);
        });

        channel.bind('client-base-damage', (data) => {
            if(gameState.bases[data.team]) {
                gameState.bases[data.team].hp = Math.max(0, gameState.bases[data.team].hp - data.damage);
            }
        });

        channel.bind('client-player-killed', (data) => {
            spawnExplosion(data.x, data.y, data.team === 'green' ? '#2ed573' : '#ff4757');
            if(gameState.players[data.id]) {
                delete gameState.players[data.id];
            }
        });
    }

    function triggerRespawn() {
        isDead = true;
        const screen = document.getElementById('respawn-screen');
        const timer = document.getElementById('respawn-timer');
        screen.style.display = 'flex';
        let timeLeft = 3;
        timer.innerText = timeLeft;

        const interval = setInterval(() => {
            timeLeft--;
            timer.innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(interval);
                screen.style.display = 'none';
                
                // Возрождение на своей базе
                const start = myTeam === 'green' ? gameState.bases.green : gameState.bases.red;
                gameState.players[myId] = {
                    x: start.x + (Math.random() * 80 - 40),
                    y: start.y + (Math.random() * 80 - 40),
                    vx: 0, vy: 0,
                    t: myTeam,
                    n: myNick,
                    hp: 3,
                    a: 0,
                    s: 0
                };
                isDead = false;
            }
        }, 1000);
    }

    function spawnExplosion(x, y, color) {
        for(let i=0; i<25; i++) {
            particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 12,
                vy: (Math.random() - 0.5) * 12,
                size: Math.random() * 6 + 3,
                color: color,
                life: 1.0
            });
        }
    }

    function gameLoop() {
        let me = gameState.players[myId];

        if (me && !isDead) {
            // ПРИЯТНАЯ ФИЗИКА (Скольжение и плавное ускорение)
            me.vx += inputs.move.x * 0.9;
            me.vy += inputs.move.y * 0.9;
            
            me.x += me.vx;
            me.y += me.vy;
            
            // Трение для эффекта скольжения
            me.vx *= 0.91;
            me.vy *= 0.91;

            // Ограничения карты
            me.x = Math.max(60, Math.min(WORLD.w - 60, me.x));
            me.y = Math.max(60, Math.min(WORLD.h - 60, me.y));

            // ПОВОРОТ ДЖОЙСТИКОМ ДВИЖЕНИЯ ИЛИ СТРЕЛЬБЫ
            const isShooting = Math.hypot(inputs.shoot.x, inputs.shoot.y) > 0.2;
            const isMoving = Math.hypot(inputs.move.x, inputs.move.y) > 0.1;

            if (isShooting) {
                me.a = Math.atan2(inputs.shoot.y, inputs.shoot.x);
                if (Date.now() - me.s > 250) {
                    let bullet = { 
                        x: me.x + Math.cos(me.a) * 40, 
                        y: me.y + Math.sin(me.a) * 40, 
                        vx: Math.cos(me.a) * 22, 
                        vy: Math.sin(me.a) * 22, 
                        t: me.t,
                        owner: myId
                    };
                    gameState.bullets.push(bullet);
                    if(channel) channel.trigger('client-shoot', bullet);
                    me.s = Date.now();
                }
            } else if (isMoving) {
                // Плавный поворот персонажа в сторону ходьбы
                me.a = Math.atan2(inputs.move.y, inputs.move.x);
            }
        }

        // ОБРАБОТКА ПУЛЬ
        for (let bi = gameState.bullets.length - 1; bi >= 0; bi--) {
            let b = gameState.bullets[bi];
            b.x += b.vx;
            b.y += b.vy;

            if (b.x < 0 || b.x > WORLD.w || b.y < 0 || b.y > WORLD.h) {
                gameState.bullets.splice(bi, 1);
                continue;
            }

            // Урон базам
            if (b.owner === myId) {
                for (let team in gameState.bases) {
                    let base = gameState.bases[team];
                    if (b.t !== team && Math.hypot(b.x - base.x, b.y - base.y) < 120) {
                        base.hp = Math.max(0, base.hp - 3);
                        gameState.bullets.splice(bi, 1);
                        if(channel) channel.trigger('client-base-damage', { team: team, damage: 3 });
                        break;
                    }
                }
            }

            // Урон игрокам (попадание)
            for (let id in gameState.players) {
                let p = gameState.players[id];
                if (b.t !== p.t && Math.hypot(b.x - p.x, b.y - p.y) < 40) {
                    if (id === myId && !isDead) {
                        p.hp--;
                        if (p.hp <= 0) {
                            spawnExplosion(p.x, p.y, p.t === 'green' ? '#2ed573' : '#ff4757');
                            if(channel) {
                                channel.trigger('client-player-killed', { id: myId, x: p.x, y: p.y, team: p.t });
                            }
                            delete gameState.players[myId];
                            triggerRespawn();
                        }
                    }
                    gameState.bullets.splice(bi, 1);
                    break;
                }
            }
        }

        // ОБРАБОТКА ЧАСТИЦ (ВЗРЫВЫ)
        for (let pi = particles.length - 1; pi >= 0; pi--) {
            let pt = particles[pi];
            pt.x += pt.vx; pt.y += pt.vy;
            pt.life -= 0.03;
            if (pt.life <= 0) particles.splice(pi, 1);
        }

        draw();
        requestAnimationFrame(gameLoop);
    }

    function draw() {
        const me = gameState.players[myId] || {x: WORLD.w/2, y: WORLD.h/2};
        
        ctx.setTransform(1,0,0,1,0,0);
        ctx.fillStyle = "#1e272e"; 
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.translate(canvas.width/2, canvas.height/2);
        ctx.scale(0.65, 0.65);
        ctx.translate(-me.x, -me.y);

        // Сеточный фон мира
        ctx.strokeStyle = "#2f3542"; ctx.lineWidth = 4;
        for(let x=0; x<=WORLD.w; x+=300) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,WORLD.h); ctx.stroke(); }
        for(let y=0; y<=WORLD.h; y+=300) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(WORLD.w,y); ctx.stroke(); }

        // Границы карты
        ctx.strokeStyle = "#ff4757"; ctx.lineWidth = 15;
        ctx.strokeRect(0, 0, WORLD.w, WORLD.h);

        // Базы
        for(let t in gameState.bases) {
            let b = gameState.bases[t];
            let g = ctx.createRadialGradient(b.x, b.y, 20, b.x, b.y, 140);
            g.addColorStop(0, t === 'green' ? 'rgba(46, 213, 115, 0.8)' : 'rgba(255, 71, 87, 0.8)');
            g.addColorStop(1, 'transparent');
            ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x, b.y, 140, 0, Math.PI*2); ctx.fill();
            
            ctx.fillStyle = t === 'green' ? '#2ed573' : '#ff4757';
            ctx.beginPath(); ctx.arc(b.x, b.y, 60, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = "white"; ctx.lineWidth = 8; ctx.stroke();
            
            ctx.fillStyle = "white"; ctx.font = "bold 32px Arial"; ctx.textAlign = "center";
            ctx.fillText(b.hp + "/100 HP", b.x, b.y - 80);
        }

        // Отрисовка игроков
        for(let id in gameState.players) {
            let p = gameState.players[id];
            ctx.save(); 
            ctx.translate(p.x, p.y);
            
            // Тень персонажа
            ctx.fillStyle = "rgba(0,0,0,0.3)";
            ctx.beginPath(); ctx.arc(0, 15, 38, 0, Math.PI*2); ctx.fill();

            // Поворот тела игрока по направлению
            ctx.rotate(p.a);
            
            // Тело
            ctx.fillStyle = p.t === 'green' ? '#2ed573' : '#ff4757';
            ctx.strokeStyle = 'white'; ctx.lineWidth = 6;
            ctx.beginPath(); ctx.arc(0, 0, 40, 0, Math.PI*2); ctx.fill(); ctx.stroke();
            
            // Пушка / Стрела направления
            ctx.fillStyle = "#ffffff";
            ctx.beginPath(); ctx.roundRect(20, -10, 35, 20, 6); ctx.fill();
            ctx.restore();
            
            // Никнейм и HP
            ctx.fillStyle = "white"; ctx.font = "bold 24px Arial"; ctx.textAlign = "center";
            ctx.fillText(p.n, p.x, p.y - 75);
            
            // Полоска здоровья над игроком
            ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.fillRect(p.x - 30, p.y - 65, 60, 8);
            ctx.fillStyle = p.hp === 3 ? "#2ed573" : p.hp === 2 ? "#ffa502" : "#ff4757";
            ctx.fillRect(p.x - 30, p.y - 65, (p.hp / 3) * 60, 8);
        }

        // Пули
        gameState.bullets.forEach(b => {
            ctx.fillStyle = "#ffa502"; ctx.strokeStyle = "white"; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(b.x, b.y, 14, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        });

        // Частицы взрыва
        particles.forEach(pt => {
            ctx.fillStyle = pt.color;
            ctx.globalAlpha = pt.life;
            ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI*2); ctx.fill();
            ctx.globalAlpha = 1.0;
        });

        ctx.setTransform(1,0,0,1,0,0);
        updateUI();
    }

    function updateUI() {
        document.getElementById('hp-g-bar').style.width = gameState.bases.green.hp + "%";
        document.getElementById('hp-r-bar').style.width = gameState.bases.red.hp + "%";
        document.getElementById('hp-g-txt').innerText = gameState.bases.green.hp + "/100";
        document.getElementById('hp-r-txt').innerText = gameState.bases.red.hp + "/100";

        // Мини-карта
        mctx.clearRect(0,0,140,90);
        const kx = 140/WORLD.w, ky = 90/WORLD.h;
        
        mctx.fillStyle = "#2ed573";
        mctx.fillRect(gameState.bases.green.x*kx-4, gameState.bases.green.y*ky-4, 8, 8);
        mctx.fillStyle = "#ff4757";
        mctx.fillRect(gameState.bases.red.x*kx-4, gameState.bases.red.y*ky-4, 8, 8);
        
        for(let id in gameState.players) {
            let p = gameState.players[id];
            mctx.fillStyle = p.t === 'green' ? '#2ed573' : '#ff4757';
            mctx.beginPath(); mctx.arc(p.x*kx, p.y*ky, 4, 0, Math.PI*2); mctx.fill();
            if(id === myId) {
                mctx.strokeStyle = "white"; mctx.lineWidth = 2;
                mctx.strokeRect(p.x*kx-6, p.y*ky-6, 12, 12);
            }
        }
        
        if(gameState.bases.green.hp <= 0) { alert("КРАСНЫЕ ПОБЕДИЛИ!"); location.reload(); }
        if(gameState.bases.red.hp <= 0) { alert("ЗЕЛЕНЫЕ ПОБЕДИЛИ!"); location.reload(); }
    }

    function resize() { 
        canvas.width = window.innerWidth; 
        canvas.height = window.innerHeight; 
        mmap.width = 140; 
        mmap.height = 90; 
        initMenuBg();
    }
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', resize);

    // Управление джойстиками
    function initJoy(id, axis) {
        const zone = document.getElementById(id), stick = zone.querySelector('.stick');
        let active = false, tid = null;
        
        const move = (ex, ey) => {
            const r = zone.getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2;
            let dx = ex - cx, dy = ey - cy, d = Math.hypot(dx, dy);
            if(d > 45) { dx *= 45/d; dy *= 45/d; }
            stick.style.transform = `translate(${dx}px, ${dy}px)`;
            inputs[axis] = { x: dx/45, y: dy/45 };
        };

        zone.addEventListener('touchstart', e => { active = true; tid = e.changedTouches[0].identifier; move(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); }, {passive:false});
        window.addEventListener('touchmove', e => { if(active) Array.from(e.touches).forEach(t => { if(t.identifier === tid) move(t.clientX, t.clientY); }); }, {passive:false});
        window.addEventListener('touchend', () => { active = false; stick.style.transform = ''; inputs[axis] = {x:0,y:0}; });
        
        zone.addEventListener('mousedown', e => { active = true; move(e.clientX, e.clientY); });
        window.addEventListener('mousemove', e => { if(active) move(e.clientX, e.clientY); });
        window.addEventListener('mouseup', () => { active = false; stick.style.transform = ''; inputs[axis] = {x:0,y:0}; });
    }
    initJoy('joy-l', 'move'); 
    initJoy('joy-r', 'shoot');
</script>
</body>
